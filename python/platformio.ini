; Created by ProgGenerator
[platformio]
src_dir = LEDs_AutoProg
    
[env]
framework = arduino
build_src_flags =
lib_deps =
    FastLED@=3.9.13
    NmraDcc
    MobaLedLib=file://libraries/MobaLedLib@3.5.0-K-long

build_src_filter =
  +<**/*.*>
  -<pyMobaLedLib_cc/>

[env:esp32]
Platform = espressif32 @ 6.9.0
Board = esp32dev
build_src_filter = ${env.src_filter} -<pyProg_Generator_MobaLedLib/>
lib_deps = ${env.lib_deps}
    WiFiManager=https://github.com/tzapu/WiFiManager.git
    EspSoftwareSerial@^8.1.0
    LocoNet2=https://github.com/Jueff/LocoNet2/archive/refs/tags/master.zip
    P_ScheduleMLX=file://D:/Development/github/WebMLL/WebMLL/python/libraries/P_ScheduleMLX
    P_ScheduleDuoMLX=file://D:/Development/github/WebMLL/WebMLL/python/libraries/P_ScheduleDuoMLX
build_unflags = -Wall

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
Board = pico
framework = arduino
board_build.core = earlephilhower
build_src_filter = ${env.src_filter} -<pyProg_Generator_MobaLedLib/>
lib_ignore =
    FastLED
    U8g2
    ArduinoOTA

[env:nano_new]
Platform = atmelavr
Board = nanoatmega328new
build_src_filter = ${env.src_filter} -<pyProg_Generator_MobaLedLib/>
lib_deps = ${env.lib_deps}
    EEProm
    SPI
    AnalogScanner=https://github.com/merose/AnalogScanner/archive/master.zip
    P_ScheduleMLX=file://D:/Development/github/WebMLL/WebMLL/python/libraries/P_ScheduleMLX
    P_ScheduleDuoMLX=file://D:/Development/github/WebMLL/WebMLL/python/libraries/P_ScheduleDuoMLX

build_unflags = -Wall

upload_flags =
    -u
    -V
